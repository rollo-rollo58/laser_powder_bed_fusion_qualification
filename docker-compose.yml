services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lpbf
      POSTGRES_USER: lpbf_user
      POSTGRES_PASSWORD: replace_for_local_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpbf_user -d lpbf"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace/backend
    command:
      - sh
      - -c
      - pip install -e /workspace/backend && uvicorn app.main:app --app-dir backend
        --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://lpbf_user:replace_for_local_dev@postgres:5432/lpbf
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - ./frontend:/workspace/frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  pgdata:

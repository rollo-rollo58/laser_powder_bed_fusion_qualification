apiVersion: apps/v1
kind: Deployment
metadata:
  name: lpbf-api
  labels:
    app: lpbf-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lpbf-api
  template:
    metadata:
      labels:
        app: lpbf-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: registry.example.invalid/lpbf-api:replace-with-reviewed-digest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 4
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: lpbf-api
spec:
  selector:
    app: lpbf-api
  ports:
    - port: 80
      targetPort: 8000
